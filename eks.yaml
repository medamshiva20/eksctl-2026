apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1
  version: "1.29"

managedNodeGroups:
  - name: spot
    instanceTypes:
      - t3.medium
      - t3.large
      - t3a.medium
      - t3a.large
    
    spot: true   # correct way instead of "spot: true"

    desiredCapacity: 2
    minSize: 1
    maxSize: 4

    volumeSize: 20
    volumeType: gp3

    amiFamily: AmazonLinux2

    privateNetworking: true

    labels:
      role: worker

    tags:
      nodegroup-type: spot